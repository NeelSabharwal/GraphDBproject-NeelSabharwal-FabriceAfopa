<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<!-- Label placement adapted from the final presentation; editable source: system-architecture.drawio. -->
<style>.p8-edge{paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1200" height="800" fill="#f8fafc"/>
<text x="40" y="45" font-family="sans-serif" font-size="24" fill="#0f172a">System architecture — local, zero paid services</text>
<line x1="260" y1="180" x2="470" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365" y="170" text-anchor="middle" class="p8-edge" font-family="sans-serif" font-size="13" fill="#334155">HTTP requests</text>
<line x1="670" y1="180" x2="870" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="170" text-anchor="middle" class="p8-edge" font-family="sans-serif" font-size="13" fill="#334155">fixed Cypher / Bolt</text>
<line x1="570" y1="240" x2="570" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="580" y="372" text-anchor="start" class="p8-edge" font-family="sans-serif" font-size="13" fill="#334155">bounded workflow</text>
<line x1="670" y1="450" x2="870" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="440" text-anchor="middle" class="p8-edge" font-family="sans-serif" font-size="13" fill="#334155">JSON actions / embeddings</text>
<line x1="260" y1="450" x2="870" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="286" text-anchor="middle" class="p8-edge" font-family="sans-serif" font-size="13" fill="#334155">scoped audited operations</text>
<line x1="260" y1="450" x2="470" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="322" text-anchor="end" class="p8-edge" font-family="sans-serif" font-size="13" fill="#334155">shared application modules</text>
<rect x="60" y="120" width="200" height="120" rx="12" fill="#dbeafe" stroke="#64748b"/>
<text x="160" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Research user / student</text>
<text x="160" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">Swagger / notebook</text>
<text x="160" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">localhost:8000</text>
<rect x="470" y="120" width="200" height="120" rx="12" fill="#d1fae5" stroke="#64748b"/>
<text x="570" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">FastAPI / Python 3.12</text>
<text x="570" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">ask + graph + health</text>
<text x="570" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">authenticated fixed import</text>
<rect x="870" y="120" width="200" height="120" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="970" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Neo4j 5.26.32</text>
<text x="970" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">GDS 2.13.2</text>
<text x="970" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">4 GiB / persistent data</text>
<rect x="470" y="390" width="200" height="120" rx="12" fill="#dbeafe" stroke="#64748b"/>
<text x="570" y="418" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">LangGraph StateGraph</text>
<text x="570" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">typed selection + routing</text>
<text x="570" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">exact source validation</text>
<rect x="870" y="390" width="200" height="120" rx="12" fill="#ede9fe" stroke="#64748b"/>
<text x="970" y="418" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Ollama CPU</text>
<text x="970" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">Qwen 3B / Nomic</text>
<text x="970" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">6 GiB / model volume</text>
<rect x="60" y="390" width="200" height="120" rx="12" fill="#ffedd5" stroke="#64748b"/>
<text x="160" y="418" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operator CLI</text>
<text x="160" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">pinned PDFs → evidence</text>
<text x="160" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">mentions / ML / GDS refresh</text>
<text x="40" y="690" font-family="sans-serif" font-size="14" fill="#334155">API memory cap 1 GiB; one agent request at a time. No direct host Bolt/Ollama exposure.</text>
<text x="40" y="715" font-family="sans-serif" font-size="14" fill="#334155">PDFs, models, reports and credentials stay outside the public API image; review/ML labels never enter retrieval.</text>
<text x="40" y="740" font-family="sans-serif" font-size="14" fill="#334155">GDS streams PageRank/Louvain from a validated in-memory projection; local ML uses paper-disjoint features.</text>
</svg>

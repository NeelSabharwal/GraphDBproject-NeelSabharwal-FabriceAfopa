name: ai-research-graphrag

services:
  neo4j:
    build:
      context: .
      dockerfile: docker/neo4j.Dockerfile
    image: ai-research-graphrag-neo4j:5.26.32-gds2.13.2
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run make configure first}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 3
    healthcheck:
      test:
        - CMD-SHELL
        - NEO4J_USERNAME=neo4j NEO4J_PASSWORD="$${NEO4J_AUTH#*/}" cypher-shell 'RETURN gds.version();' >/dev/null 2>&1
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_VULKAN: '0'
      CUDA_VISIBLE_DEVICES: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 8
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-research-graphrag-api:infra
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run make configure first}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen2.5:3b-instruct
      OLLAMA_EMBED_MODEL: nomic-embed-text:v1.5
      READINESS_TIMEOUT: '3'
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:

name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pylint --rcfile=.pylintrc --fail-under=9.5 app scripts
  unit-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -m 'not integration' --cov=app --cov-fail-under=60 --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: unit-api-coverage
          path: coverage.xml
# Live Neo4j/GDS, pinned corpus, and Ollama checks run separately with make test.
# No private corpus, credentials, model weights or label exports enter this workflow.
